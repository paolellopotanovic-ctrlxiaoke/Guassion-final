[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-direct128"
version = "0.1.0"
description = "Geometry-aware partner-free protein-binding residue prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC BY-NC-SA 4.0"}
authors = [{name = "Gaussian-direct128 authors"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1,<2.6",
  "lightning>=2.4,<3",
  "tqdm",
  "gemmi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
